services:
  api:
    build: .
    command: ["uvicorn", "ghostnet.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      GHOSTNET_DATABASE: /app/data/ghostnet.sqlite3
      GHOSTNET_HASH_KEY: ${GHOSTNET_HASH_KEY:-local-demo-key-change-me}
      GHOSTNET_API_URL: http://api:8000
    ports: ["127.0.0.1:8000:8000"]
    volumes: [ghostnet_data:/app/data]
    networks: [control, deception]
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.75", pids: 64 }
  web-admin:
    build: .
    command: ["python", "-m", "ghostnet.decoys.web_admin"]
    environment:
      GHOSTNET_API_URL: "http://api:8000"
      GHOSTNET_HASH_KEY: "${GHOSTNET_HASH_KEY:-local-demo-key-change-me}"
    ports: ["127.0.0.1:8081:8080"]
    networks: [deception]
    labels:
      ghostnet.role: decoy
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=8m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.50", pids: 64 }
  fake-ssh:
    build: .
    command: ["python", "-m", "ghostnet.decoys.fake_ssh"]
    environment:
      GHOSTNET_API_URL: "http://api:8000"
      GHOSTNET_HASH_KEY: "${GHOSTNET_HASH_KEY:-local-demo-key-change-me}"
    ports: ["127.0.0.1:2222:2222"]
    networks: [deception]
    labels:
      ghostnet.role: decoy
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=8m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.50", pids: 64 }
  fake-db:
    build: .
    command: ["python", "-m", "ghostnet.decoys.fake_db"]
    environment:
      GHOSTNET_API_URL: "http://api:8000"
      GHOSTNET_HASH_KEY: "${GHOSTNET_HASH_KEY:-local-demo-key-change-me}"
    ports: ["127.0.0.1:5433:5433"]
    networks: [deception]
    labels:
      ghostnet.role: decoy
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=8m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.50", pids: 64 }
  dashboard:
    build: ./dashboard
    ports: ["127.0.0.1:5173:80"]
    networks: [control]
    depends_on: [api]
networks:
  control: {}
  deception:
    internal: true
volumes:
  ghostnet_data:
