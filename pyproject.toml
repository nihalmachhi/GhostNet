[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghostnet"
version = "0.1.0"
description = "Contained defensive deception and behavior analysis lab"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3", "PyYAML>=6,<7", "networkx>=3.3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.hatch.build.targets.wheel]
packages = ["ghostnet"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
