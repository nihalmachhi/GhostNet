[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghostnet"
version = "0.1.0"
description = "Contained defensive deception and behavior analysis lab"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3", "PyYAML>=6,<7", "networkx>=3.3,<4", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "httpx>=0.27,<1", "ruff>=0.17.3,<1", "mypy>=1.11,<2"]

[project.scripts]
ghostnet = "ghostnet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostnet"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/ghostnet/decoys/*" = ["S104", "SIM105"]
"src/ghostnet/orchestrator/*" = ["S603", "S607", "T201"]
"testactors/*" = ["S310", "T201"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["ghostnet"]
strict = true

[[tool.mypy.overrides]]
module = ["yaml.*", "networkx.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["ghostnet"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
