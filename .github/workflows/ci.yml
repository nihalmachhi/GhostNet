name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      GHOSTNET_HASH_KEY: ci-only-key-not-a-secret-0001
      GHOSTNET_INGEST_SECRET: ci-only-ingest-secret-0001
      GHOSTNET_ADMIN_TOKEN: ci-only-admin-token-0001
      GHOSTNET_CHAIN_KEY: ci-only-chain-key-0001
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q --cov=ghostnet --cov-fail-under=80
  docker:
    runs-on: ubuntu-latest
    env:
      GHOSTNET_HASH_KEY: ci-only-key-not-a-secret-0001
      GHOSTNET_INGEST_SECRET: ci-only-ingest-secret-0001
      GHOSTNET_ADMIN_TOKEN: ci-only-admin-token-0001
      GHOSTNET_CHAIN_KEY: ci-only-chain-key-0001
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build