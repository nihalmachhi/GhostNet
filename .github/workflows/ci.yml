name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      GHOSTNET_HASH_KEY: ci-only-key-not-a-secret-0001
      GHOSTNET_INGEST_SECRET: ci-only-ingest-secret-0001
      GHOSTNET_ADMIN_TOKEN: ci-only-admin-token-0001
      GHOSTNET_CHAIN_KEY: ci-only-chain-key-0001
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q --cov=ghostnet --cov-fail-under=80
      - run: uv run python -m ghostnet.orchestrator.containment_check
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run lint
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: npm test -- --run
        working-directory: site
      - run: npm run build
        working-directory: site
  docker:
    runs-on: ubuntu-latest
    env:
      GHOSTNET_HASH_KEY: ci-only-key-not-a-secret-0001
      GHOSTNET_INGEST_SECRET: ci-only-ingest-secret-0001
      GHOSTNET_ADMIN_TOKEN: ci-only-admin-token-0001
      GHOSTNET_CHAIN_KEY: ci-only-chain-key-0001
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build